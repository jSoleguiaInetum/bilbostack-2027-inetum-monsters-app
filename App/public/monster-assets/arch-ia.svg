<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arch-ia-brain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#1B243B" />
    </linearGradient>
    <filter id="arch-ia-brain-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="arch-ia" class="layer-7" transform="translate(410, 410)" filter="url(#arch-ia-brain-shadow)">
    <!-- 1. Contenedor con forma de cerebro / silueta orgánica tecnológica opaca estándar (0,0 a 80,80) -->
    <path d="M 40,8 C 22,8 10,20 10,36 C 10,48 18,58 26,62 L 26,70 C 26,73 30,75 33,73 L 40,68 L 47,73 C 50,75 54,73 54,70 L 54,62 C 62,58 70,48 70,36 C 70,20 58,8 40,8 Z" fill="url(#arch-ia-brain-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round" />

    <!-- 2. Contenido interior escalado con exactitud al estándar general (0.85) -->
    <g transform="translate(40, 40) scale(0.85) translate(-40, -40)">
      <!-- Marco interior decorativo con esquinas inferiores juntas -->
      <path d="M 40,11 C 24,11 13,21 13,36 C 13,47 18,55 25,60 L 28,66 L 40,60 L 52,66 L 55,60 C 62,55 67,47 67,36 C 67,21 56,11 40,11 Z" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2.2" stroke-linejoin="round" />

      <!-- Icono interior: Neurona y Engranajes -->
      <g id="neuron-side">
        <line x1="27" y1="36" x2="20" y2="22" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
        <line x1="27" y1="36" x2="34" y2="22" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
        <line x1="34" y1="22" x2="31" y2="15" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
        <line x1="34" y1="22" x2="39" y2="18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
        <line x1="27" y1="36" x2="18" y2="50" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
        
        <circle cx="27" cy="36" r="6" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1.5" />
        <circle cx="27" cy="36" r="2.2" fill="#FFFFFF" />
        
        <circle cx="20" cy="22" r="2.2" fill="var(--color-accent, #F5F340)" />
        <circle cx="31" cy="15" r="1.8" fill="var(--color-accent, #F5F340)" />
        <circle cx="39" cy="18" r="1.8" fill="var(--color-accent, #F5F340)" />
        <circle cx="18" cy="50" r="2.2" fill="var(--color-accent, #F5F340)" />
      </g>

      <!-- Engranaje Principal (Derecha) -->
      <g id="gear-main" transform="translate(54, 33)">
        <circle cx="0" cy="0" r="9.5" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="2" />
        <circle cx="0" cy="0" r="3.5" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(51.43)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(102.86)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(154.29)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(205.71)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(257.14)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(308.57)" fill="var(--color-accent, #F5F340)" rx="0.4" />
      </g>

      <!-- Segundo Engranaje Idéntico al 40% de tamaño ubicado abajo a la izquierda del principal -->
      <g id="gear-secondary" transform="translate(44, 47) scale(0.4)">
        <circle cx="0" cy="0" r="9.5" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="2" />
        <circle cx="0" cy="0" r="3.5" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(51.43)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(102.86)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(154.29)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(205.71)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(257.14)" fill="var(--color-accent, #F5F340)" rx="0.4" />
        <rect x="-0.9" y="-11.5" width="1.8" height="3" transform="rotate(308.57)" fill="var(--color-accent, #F5F340)" rx="0.4" />
      </g>
    </g>

    <!-- 3. Detalle de acento (arriba derecha) -->
    <circle cx="64" cy="16" r="3" fill="var(--color-accent, #F5F340)" />

    <!-- 4. Círculo adicional más pequeño abajo a la derecha -->
    <circle cx="64" cy="64" r="2.2" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
  </g>
</svg>