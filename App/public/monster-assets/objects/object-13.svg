<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="acc-13-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#151C33" />
    </linearGradient>
    <filter id="acc-13-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <g id="acc-13" class="layer-6" transform="translate(130, 100)" filter="url(#acc-13-shadow)">
    <!-- Sombra de flotación inferior -->
    <ellipse cx="28" cy="72" rx="24" ry="5" fill="#000000" opacity="0.3" />
    
    <!-- Cinta / Lanyard en un único hilo continuo -->
    <path d="M 20,68 C 10,60 2,45 10,25 C 14,15 19,2 19,2 L 28,12 L 37,2 C 37,2 42,15 46,25 C 54,45 46,60 36,68 C 30,72 26,72 20,68 Z" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Clip metálico superior -->
    <rect x="22" y="10" width="12" height="4" rx="1" fill="#C0CBDC" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
    
    <!-- Tarjetero / Credencial VIP flotante -->
    <rect x="12" y="14" width="32" height="40" rx="3" fill="url(#acc-13-card)" stroke="var(--color-accent, #F5F340)" stroke-width="2" />
    
    <!-- Elementos interiores de la acreditación -->
    <!-- Avatar / Círculo rosa con cara estilizada -->
    <circle cx="28" cy="24" r="6" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
    <!-- Ojos de la cara -->
    <circle cx="26" cy="23" r="0.8" fill="var(--color-primary, #232D4B)" />
    <circle cx="30" cy="23" r="0.8" fill="var(--color-primary, #232D4B)" />
    <!-- Sonrisa amigable -->
    <path d="M 26,26 C 27,27.5 29,27.5 30,26" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="0.8" stroke-linecap="round" />
    
    <!-- Líneas abstractas de texto / datos -->
    <line x1="18" y1="33" x2="38" y2="33" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="22" y1="39" x2="34" y2="39" stroke="var(--color-accent, #F5F340)" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Sello / Badge inferior corporativo -->
    <circle cx="28" cy="46" r="2" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>