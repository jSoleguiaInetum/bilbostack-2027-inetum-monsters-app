<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="acc-04-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#151C33" />
    </linearGradient>
    <filter id="acc-04-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <g id="acc-04" class="layer-6" transform="translate(110, 90)" filter="url(#acc-04-shadow)">
    <!-- Sombra de flotación -->
    <ellipse cx="32" cy="56" rx="26" ry="5" fill="#000000" opacity="0.3" />
    
    <!-- Pantalla del monitor -->
    <rect x="4" y="6" width="56" height="42" rx="4" fill="url(#acc-04-grad)" stroke="var(--color-secondary, #E20074)" stroke-width="2" />
    
    <!-- Peana y base del monitor -->
    <path d="M 26,48 L 38,48 L 36,54 L 28,54 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
    
    <!-- Líneas de código simuladas -->
    <line x1="12" y1="16" x2="24" y2="16" stroke="var(--color-accent, #F5F340)" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="24" x2="36" y2="24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="32" x2="28" y2="32" stroke="var(--color-secondary, #E20074)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Cursor / píxel parpadeante -->
    <rect x="31" y="30" width="3" height="4" fill="var(--color-accent, #F5F340)" rx="0.5" />
  </g>
</svg>