    <path d="M 25.5,33.3 L 30.5,33.3 C 31.3,33.3 31.7,32.5 31.2,31.8 C 31.2,31.0 29.8,30.6 29.3,31.0 C 28.8,30.1 27,30.6 27,31.5 C 26,31.5 26,32.8 25.5,33.3 Z" fill="#FFFFFF" opacity="0.9" />
    
