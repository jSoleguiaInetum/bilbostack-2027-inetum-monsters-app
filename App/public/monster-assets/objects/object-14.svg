    <line x1="11.2" y1="33.0" x2="12.5" y2="32.5" stroke="var(--color-secondary, #E20074)" stroke-width="0.6" />
    <line x1="15.5" y1="32.5" x2="16.8" y2="33.0" stroke="var(--color-secondary, #E20074)" stroke-width="0.6" />
    <path d="M 13.5,28.3 L 12.8,27.6 M 14.5,28.3 L 15.2,27.6" stroke="var(--color-secondary, #E20074)" stroke-width="0.6" stroke-linecap="round" />
    
    <!-- Tecla 5: Nube + Sol bajados un poco más en conjunto -->
    <rect x="23" y="26" width="10" height="10" rx="2" fill="#0A0E1A" stroke="var(--color-accent, #F5F340)" stroke-width="1" />
