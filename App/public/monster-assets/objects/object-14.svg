    <rect x="37" y="14" width="10" height="10" rx="2" fill="#0A0E1A" stroke="var(--color-accent, #F5F340)" stroke-width="1" />
    <path d="M 39.5,17.5 L 38.5,19 L 39.5,20.5" fill="none" stroke="#00FF66" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" />
