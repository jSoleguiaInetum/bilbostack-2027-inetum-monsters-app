    <rect x="37" y="26" width="10" height="10" rx="2" fill="#0A0E1A" stroke="var(--color-accent, #F5F340)" stroke-width="1" />
    <circle cx="42" cy="31" r="2.2" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="1.2" />
