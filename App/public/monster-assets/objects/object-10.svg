<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="acc-10-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#151C33" />
    </linearGradient>
    <filter id="acc-10-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <g id="acc-10" class="layer-6" transform="translate(340, 110)" filter="url(#acc-10-shadow)">
    <!-- Sombra de flotación inferior -->
    <ellipse cx="28" cy="58" rx="20" ry="5" fill="#000000" opacity="0.3" />
    
    <!-- Vapor flotante superior -->
    <path d="M 22,12 C 18,8 22,2 26,2" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 34,10 C 38,6 34,0 30,-2" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    
    <!-- Tapa del termo -->
    <path d="M 18,14 L 38,14 C 40,14 41,16 40,18 L 16,18 C 15,16 16,14 18,14 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="1.2" />
    
    <!-- Cuerpo del termo / taza térmica -->
    <path d="M 17,20 L 39,20 C 40,20 41,22 40,24 L 37,50 C 37,52 35,53 33,53 L 23,53 C 21,53 19,52 19,50 L 16,24 C 15,22 16,20 17,20 Z" fill="url(#acc-10-grad)" stroke="var(--color-secondary, #E20074)" stroke-width="2" />
    
    <!-- Banda de silicona central (detalle de marca) -->
    <rect x="17.5" y="30" width="21" height="10" fill="var(--color-secondary, #E20074)" opacity="0.85" />
    <circle cx="28" cy="35" r="2" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>