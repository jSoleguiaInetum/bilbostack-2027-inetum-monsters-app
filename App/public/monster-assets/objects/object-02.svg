<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="acc-02-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#151C33" />
    </linearGradient>
    <filter id="acc-02-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <g id="acc-02" class="layer-6" transform="translate(340, 110)" filter="url(#acc-02-shadow)">
    <!-- Sombra de flotación -->
    <ellipse cx="32" cy="54" rx="26" ry="5" fill="#000000" opacity="0.3" />
    
    <!-- Silueta clásica y orgánica de paleta de pintor con muesca y forma de riñón -->
    <path d="M 32,6 C 14,6 4,18 4,32 C 4,46 16,56 28,56 C 34,56 36,52 36,48 C 36,45 34,42 32,39 C 29,36 28,33 30,30 C 32,26 38,24 44,28 C 52,34 58,28 60,20 C 62,10 50,6 32,6 Z" fill="url(#acc-02-grad)" stroke="var(--color-secondary, #E20074)" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Orificio clásico para el pulgar -->
    <ellipse cx="18" cy="38" rx="3.5" ry="5" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="1.5" />

    <!-- Godets de color digitales corporativos distribuidos en la paleta -->
    <circle cx="20" cy="18" r="4" fill="var(--color-accent, #F5F340)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
    <circle cx="36" cy="14" r="4.5" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
    <circle cx="50" cy="22" r="4" fill="#FFFFFF" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
    <circle cx="44" cy="40" r="3.5" fill="var(--color-accent, #F5F340)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
  </g>
</svg>