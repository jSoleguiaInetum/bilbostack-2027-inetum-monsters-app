<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-05-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="65%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-05-crystal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8F5FF"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
  </defs>
  <g id="body-05" class="layer-2">
    <!-- 1. Sombra proyectada geométrica -->
    <ellipse cx="256" cy="435" rx="120" ry="20" fill="var(--color-primary, #232D4B)" opacity="0.25"/>

    <!-- 2. Cristal base trasero flotante -->
    <polygon points="256,90 370,180 340,380 172,380 142,180" fill="url(#body-05-crystal)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5" opacity="0.4"/>

    <!-- 3. Silueta principal: Prisma facetado central -->
    <path d="M256,100 
             L360,175 
             L345,370 
             L167,370 
             L152,175 Z" 
          fill="url(#body-05-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>

    <!-- 4. Facetas internas de refracción de luz -->
    <polygon points="256,100 256,370 360,175" fill="var(--color-accent, #F5F340)" opacity="0.2"/>
    <polygon points="256,100 256,370 152,175" fill="#B8F5FF" opacity="0.25"/>

    <!-- 5. Sombra profunda inferior -->
    <path d="M167,370 L256,410 L345,370 L256,340 Z" fill="var(--color-primary, #232D4B)" opacity="0.4"/>

    <!-- 6. Núcleo cristalino central -->
    <polygon points="256,230 285,275 256,320 227,275" fill="var(--color-primary, #232D4B)" stroke="var(--color-secondary, #E20074)" stroke-width="2"/>

    <!-- 7. Borde de definición maestro -->
    <path d="M256,100 L360,175 L345,370 L167,370 L152,175 Z" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="3" opacity="0.5"/>
  </g>
</svg>