<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arch-devops-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#1B243B" />
    </linearGradient>
    <filter id="arch-devops-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="arch-devops" class="layer-7" transform="translate(410, 410)" filter="url(#arch-devops-shadow)">
    <!-- 1. Contenedor: Engranaje redondo clásico con dientes rectangulares simétricos (opaco) -->
    <path d="M 33,8 L 47,8 L 48,16 L 57,14 L 63,20 L 61,29 L 68,34 L 68,46 L 61,51 L 63,60 L 57,66 L 48,64 L 47,72 L 33,72 L 32,64 L 23,66 L 17,60 L 19,51 L 12,46 L 12,34 L 19,29 L 17,20 L 23,14 L 32,16 Z" fill="url(#arch-devops-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5" stroke-linejoin="round" />

    <!-- 2. Contenido interior escalado con margen de respiro respecto al contorno -->
    <g transform="translate(40, 40) scale(0.85) translate(-40, -40)">
      <!-- Círculo amarillo ancho discontinuo -->
      <circle cx="40" cy="40" r="25" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="4.5" stroke-dasharray="6 4" />
      <!-- Marco secundario -->
      <circle cx="40" cy="40" r="20" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="1.5" />
      <!-- Símbolo de Infinito / Lemniscata simétrica central -->
      <path d="M 40,40 C 30,26 18,26 18,40 C 18,54 30,54 40,40 C 50,26 62,26 62,40 C 62,54 50,54 40,40 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 3. Detalle de acento -->
    <circle cx="64" cy="16" r="3" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>