<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="eyes-09-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </radialGradient>
  </defs>
  <g id="eyes-09" class="layer-4">
    <!-- Asimétricos (Caos creativo): Un ojo grande redondo + uno pequeño cuadrado/triangular -->
    <!-- Ojo izquierdo grande -->
    <circle cx="180" cy="210" r="38" fill="#FFFFFF" stroke="var(--color-primary, #232D4B)" stroke-width="4"/>
    <circle cx="184" cy="212" r="22" fill="url(#eyes-09-iris)"/>
    <circle cx="186" cy="214" r="10" fill="var(--color-primary, #232D4B)"/>
    <circle cx="174" cy="200" r="6" fill="#FFFFFF"/>

    <!-- Ojo derecho pequeño angular -->
    <polygon points="320,190 350,215 310,240" fill="#FFFFFF" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="325" cy="215" r="10" fill="var(--color-secondary, #E20074)"/>
    <circle cx="325" cy="215" r="4" fill="var(--color-primary, #232D4B)"/>
    <circle cx="322" cy="211" r="2" fill="#FFFFFF"/>

    <!-- Expresiones cejas caóticas -->
    <path d="M145,160 Q180,140 215,165" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="4" stroke-linecap="round"/>
    <line x1="300" y1="175" x2="355" y2="185" stroke="var(--color-primary, #232D4B)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>