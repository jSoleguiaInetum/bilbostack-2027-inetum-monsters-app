<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-10-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="60%" stop-color="#2B1840"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <radialGradient id="body-10-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </radialGradient>
  </defs>
  <g id="body-10" class="layer-2">
    <!-- 1. Sombra magnética anular en el suelo -->
    <ellipse cx="256" cy="445" rx="120" ry="18" fill="var(--color-primary, #232D4B)" opacity="0.3"/>

    <!-- 2. Silueta principal: Anillo Toroidal Flotante con núcleo hueco -->
    <path d="M256,100 
             C350,100 420,170 420,256 
             C420,342 350,412 256,412 
             C162,412 92,342 92,256 
             C92,170 162,100 256,100 Z 
             M256,180 
             C205,180 165,220 165,256 
             C165,292 205,332 256,332 
             C307,332 347,292 347,256 
             C347,220 307,180 256,180 Z" 
          fill="url(#body-10-ring-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" fill-rule="evenodd" stroke-linejoin="round"/>

    <!-- 3. Núcleo de energía interno suspendido en el vacío central -->
    <circle cx="256" cy="256" r="32" fill="url(#body-10-core-glow)" opacity="0.85"/>
    <circle cx="256" cy="256" r="16" fill="#FFF7B4" opacity="0.7"/>

    <!-- 4. Emisores de campo magnético superior e inferior (fuera de zona de ojos) -->
    <path d="M242,100 L256,70 L270,100 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2"/>
    <circle cx="256" cy="70" r="4.5" fill="var(--color-secondary, #E20074)"/>
    <path d="M242,412 L256,442 L270,412 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2"/>

    <!-- 5. Blindaje pectoral inferior de contención (respetando zona en y >= 285) -->
    <g id="body-10-chest">
      <path d="M220,332 L256,322 L292,332 L282,385 L256,395 L230,385 Z" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="256" cy="358" r="5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- 6. Highlights de volumen superior en el anillo -->
    <path d="M256,115 C335,115 395,175 402,245 C380,195 325,160 256,160 C187,160 132,195 110,245 C117,175 177,115 256,115 Z" fill="#FFF7B4" opacity="0.3"/>
  </g>
</svg>