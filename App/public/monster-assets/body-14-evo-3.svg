<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-14-evo-3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="#191B2E"/>
    </linearGradient>
    <linearGradient id="body-14-evo-3-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
    <radialGradient id="body-14-evo-3-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7B4"/>
      <stop offset="60%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </radialGradient>
  </defs>
  <g id="body-14-evo-3" class="layer-2">
    <ellipse cx="256" cy="458" rx="140" ry="24" fill="var(--color-primary, #232D4B)" opacity="0.42"/>

    <!-- Alas/Auras cónicas de plasma de aceleración cuántica (+15%) -->
    <g id="body-14-evo-3-wings">
      <polygon points="120,210 40,140 85,80 145,150" fill="url(#body-14-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="40" cy="140" r="6" fill="var(--color-accent, #F5F340)"/>
      <polygon points="392,210 472,140 427,80 367,150" fill="url(#body-14-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="472" cy="140" r="6" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Monolito piramidal definitivo (+15% bounding box) -->
    <path d="M140,90 L372,90 L420,220 L256,458 L92,220 Z" fill="url(#body-14-evo-3-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="140,90 256,90 256,458 92,220" fill="#FFF7B4" opacity="0.32"/>

    <!-- Corona imperial piramidal -->
    <g id="body-14-evo-3-crown">
      <polygon points="215,90 256,20 297,90" fill="url(#body-14-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="256" cy="20" r="7.5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Armadura pectoral con reactor cuántico en y >= 285 -->
    <g id="body-14-evo-3-chest">
      <polygon points="180,300 332,300 307,390 205,390" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="256" cy="345" r="15" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2.5"/>
      <circle cx="256" cy="345" r="9" fill="url(#body-14-evo-3-core)"/>
      <circle cx="253" cy="342" r="3.5" fill="#FFF7B4"/>
    </g>
  </g>
</svg>