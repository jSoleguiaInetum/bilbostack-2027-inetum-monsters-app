<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arch-qa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#1B243B" />
    </linearGradient>
    <filter id="arch-qa-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="arch-qa" class="layer-7" transform="translate(410, 410)" filter="url(#arch-qa-shadow)">
    <!-- 1. Contenedor con forma de escudo / placa de certificación opaca (0,0 a 80,80) -->
    <path d="M 40,6 C 58,6 70,12 70,28 C 70,52 54,68 40,74 C 26,68 10,52 10,28 C 10,12 22,6 40,6 Z" fill="url(#arch-qa-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round" />

    <!-- 2. Marco interior decorativo -->
    <path d="M 40,12 C 54,12 62,17 62,28 C 62,46 49,60 40,65 C 31,60 18,46 18,28 C 18,17 26,12 40,12 Z" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2" stroke-linejoin="round" />

    <!-- 3. Icono QA: Lupa de inspección, marca de verificación y bug estilizado -->
    <!-- Lupa de inspección -->
    <circle cx="32" cy="36" r="12" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="3" />
    <line x1="40" y1="44" x2="52" y2="56" stroke="var(--color-accent, #F5F340)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Checkmark de validación -->
    <path d="M 25,36 L 30,41 L 38,31" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Elemento de Bug / Insecto estilizado -->
    <g transform="translate(50, 22) scale(0.7)">
      <ellipse cx="0" cy="0" rx="5" ry="7" fill="var(--color-secondary, #E20074)" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="-3" y1="-7" x2="-6" y2="-11" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
      <line x1="3" y1="-7" x2="6" y2="-11" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-5" y1="-2" x2="-9" y2="-3" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-5" y1="2" x2="-9" y2="3" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
      <line x1="5" y1="-2" x2="9" y2="-3" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
      <line x1="5" y1="2" x2="9" y2="3" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- 4. Detalle de acento -->
    <circle cx="62" cy="18" r="3" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>