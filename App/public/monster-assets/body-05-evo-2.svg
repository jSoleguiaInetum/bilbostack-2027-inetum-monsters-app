<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-05-evo-2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="60%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-05-evo-2-crystal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8F5FF"/>
      <stop offset="50%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="100%" stop-color="#2B1840"/>
    </linearGradient>
  </defs>
  <g id="body-05-evo-2" class="layer-2">
    <!-- 1. Sombra proyectada amplia -->
    <ellipse cx="256" cy="442" rx="138" ry="23" fill="var(--color-primary, #232D4B)" opacity="0.3"/>

    <!-- 2. Cristales laterales flotantes de resonancia -->
    <polygon points="140,245 80,195 110,290 155,275" fill="url(#body-05-evo-2-crystal)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>
    <circle cx="80" cy="195" r="4" fill="var(--color-accent, #F5F340)"/>
    <polygon points="372,245 432,195 402,290 357,275" fill="url(#body-05-evo-2-crystal)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>
    <circle cx="432" cy="195" r="4" fill="var(--color-accent, #F5F340)"/>

    <!-- 3. Cuerpo principal expandido (+10% bounding box) -->
    <path d="M256,75 L382,160 L365,385 L147,385 L130,160 Z" fill="url(#body-05-evo-2-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- 4. Corona de cristal superior -->
    <polygon points="256,75 225,35 287,35" fill="url(#body-05-evo-2-crystal)" stroke="var(--color-accent, #F5F340)" stroke-width="2.5"/>
    <circle cx="256" cy="35" r="5" fill="var(--color-secondary, #E20074)"/>

    <!-- 5. Blindaje pectoral de cristal reforzado (respetando zona en y >= 285) -->
    <g id="body-05-evo-2-chest">
      <polygon points="205,295 307,295 295,370 217,370" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="256" cy="332" r="9" fill="var(--color-primary, #232D4B)" stroke="#B8F5FF" stroke-width="2"/>
      <circle cx="256" cy="332" r="4" fill="var(--color-secondary, #E20074)"/>
    </g>

    <!-- 6. Highlights -->
    <polygon points="256,75 256,385 382,160" fill="#FFF7B4" opacity="0.3"/>
  </g>
</svg>