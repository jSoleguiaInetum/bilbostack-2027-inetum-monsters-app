<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-13-evo-2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="65%" stop-color="#1E1B3A"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-13-evo-2-gill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
  </defs>
  <g id="body-13-evo-2" class="layer-2">
    <ellipse cx="256" cy="446" rx="135" ry="22" fill="var(--color-primary, #232D4B)" opacity="0.35"/>

    <!-- Corona de branquias cibernéticas hiper-desarrolladas -->
    <g id="body-13-evo-2-gills">
      <path d="M165,135 C108,95 55,108 35,132 C60,148 112,142 152,152 Z" fill="url(#body-13-evo-2-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>
      <circle cx="35" cy="132" r="5" fill="var(--color-accent, #F5F340)"/>
      <path d="M152,168 C95,152 40,182 25,208 C55,215 105,190 145,185 Z" fill="url(#body-13-evo-2-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>
      <circle cx="25" cy="208" r="5" fill="var(--color-accent, #F5F340)"/>
      <path d="M155,200 C100,218 55,255 48,280 C78,272 120,240 152,218 Z" fill="url(#body-13-evo-2-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>

      <path d="M347,135 C404,95 457,108 477,132 C452,148 400,142 360,152 Z" fill="url(#body-13-evo-2-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>
      <circle cx="477" cy="132" r="5" fill="var(--color-accent, #F5F340)"/>
      <path d="M360,168 C417,152 472,182 487,208 C457,215 407,190 367,185 Z" fill="url(#body-13-evo-2-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>
      <circle cx="487" cy="208" r="5" fill="var(--color-accent, #F5F340)"/>
      <path d="M357,200 C412,218 457,255 464,280 C434,272 392,240 360,218 Z" fill="url(#body-13-evo-2-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>
    </g>

    <!-- Torso expandido (+10% bounding box) -->
    <path d="M182,120 C220,95 292,95 330,120 C375,152 392,225 378,302 C364,378 332,435 256,442 C180,435 148,378 134,302 C120,225 137,152 182,120 Z" fill="url(#body-13-evo-2-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="4" stroke-linejoin="round"/>

    <!-- Corona de sensores -->
    <g id="body-13-evo-2-crest">
      <path d="M228,98 L256,50 L284,98 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2.5"/>
      <circle cx="256" cy="50" r="5.5" fill="var(--color-secondary, #E20074)"/>
    </g>

    <!-- Armadura ventral reforzada (y >= 285) -->
    <g id="body-13-evo-2-chest">
      <path d="M190,298 L256,282 L322,298 L305,372 L256,388 L207,372 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="256" cy="338" r="10" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="2"/>
      <circle cx="256" cy="338" r="5" fill="var(--color-secondary, #E20074)"/>
    </g>
  </g>
</svg>