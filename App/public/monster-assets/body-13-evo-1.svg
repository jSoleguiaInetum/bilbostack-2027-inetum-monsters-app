<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-13-evo-1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="65%" stop-color="#1E1B3A"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-13-evo-1-gill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
  </defs>
  <g id="body-13-evo-1" class="layer-2">
    <ellipse cx="256" cy="440" rx="124" ry="20" fill="var(--color-primary, #232D4B)" opacity="0.32"/>

    <!-- Branquias bioluminiscentes extendidas con nodos de luz -->
    <g id="body-13-evo-1-gills">
      <path d="M160,145 C110,110 65,120 48,142 C70,155 115,150 152,160 Z" fill="url(#body-13-evo-1-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
      <circle cx="48" cy="142" r="4" fill="var(--color-accent, #F5F340)"/>
      <path d="M150,175 C98,162 48,190 35,212 C62,218 108,195 145,190 Z" fill="url(#body-13-evo-1-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
      <circle cx="35" cy="212" r="4" fill="var(--color-accent, #F5F340)"/>
      <path d="M152,205 C102,222 62,255 55,278 C80,272 118,242 148,220 Z" fill="url(#body-13-evo-1-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>

      <path d="M352,145 C402,110 447,120 464,142 C442,155 397,150 360,160 Z" fill="url(#body-13-evo-1-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
      <circle cx="464" cy="142" r="4" fill="var(--color-accent, #F5F340)"/>
      <path d="M362,175 C414,162 464,190 477,212 C450,218 404,195 367,190 Z" fill="url(#body-13-evo-1-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
      <circle cx="477" cy="212" r="4" fill="var(--color-accent, #F5F340)"/>
      <path d="M360,205 C410,222 450,255 457,278 C432,272 394,242 364,220 Z" fill="url(#body-13-evo-1-gill)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
    </g>

    <!-- Torso anfibio -->
    <path d="M190,130 C225,105 287,105 322,130 C365,160 380,228 365,298 C350,368 322,420 256,428 C190,420 162,368 147,298 C132,228 147,160 190,130 Z" fill="url(#body-13-evo-1-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Sensor cristalino apical en la coronilla (y < 120) -->
    <path d="M238,105 L256,65 L274,105 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2"/>
    <circle cx="256" cy="65" r="4.5" fill="var(--color-secondary, #E20074)"/>

    <!-- Armadura pectoral con reactor de agua pesada (y >= 285) -->
    <g id="body-13-evo-1-chest">
      <path d="M200,295 L256,280 L312,295 L298,368 L256,382 L214,368 Z" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="256" cy="332" r="7" fill="var(--color-accent, #F5F340)" stroke="var(--color-secondary, #E20074)" stroke-width="1.5"/>
    </g>
  </g>
</svg>