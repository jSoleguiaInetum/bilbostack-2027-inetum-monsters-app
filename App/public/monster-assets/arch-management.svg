<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arch-management-grad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#1B243B" />
    </linearGradient>
    <filter id="arch-management-shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="arch-management" class="layer-7" transform="translate(410, 410)" filter="url(#arch-management-shadow8)">
    <!-- 1. Contenedor con forma de escudo corporativo / insignia opaca (0,0 a 80,80) -->
    <path d="M 40,6 L 70,16 L 70,42 C 70,58 56,70 40,76 C 24,70 10,58 10,42 L 10,16 Z" fill="url(#arch-management-grad8)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round" />

    <!-- 2. Contenido interior escalado con exactitud al estándar de los demás badges (0.85) -->
    <g transform="translate(40, 40) scale(0.85) translate(-40, -40)">
      <!-- Marco interior decorativo -->
      <path d="M 40,12 L 62,20 L 62,40 C 62,53 52,62 40,67 C 28,62 18,53 18,40 L 18,20 Z" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2" stroke-linejoin="round" />

      <!-- Icono Management: Engranaje ejecutivo / Gobernanza y maquinaria directiva -->
      <circle cx="40" cy="40" r="16" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="2.5" stroke-dasharray="4 2" />
      <circle cx="40" cy="40" r="9" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1.5" />
      <circle cx="40" cy="40" r="3.5" fill="#FFFFFF" />
      <rect x="38" y="27" width="4" height="4" fill="var(--color-accent, #F5F340)" rx="1" />
      <rect x="38" y="49" width="4" height="4" fill="var(--color-accent, #F5F340)" rx="1" />
      <rect x="27" y="38" width="4" height="4" fill="var(--color-accent, #F5F340)" rx="1" />
      <rect x="49" y="38" width="4" height="4" fill="var(--color-accent, #F5F340)" rx="1" />
    </g>

    <!-- 3. Detalle de acento -->
    <circle cx="64" cy="16" r="3" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>