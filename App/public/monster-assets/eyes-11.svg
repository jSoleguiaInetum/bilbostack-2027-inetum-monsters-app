<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="eyes-11-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BB9FE"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
  </defs>
  <g id="eyes-11" class="layer-4">
    <!-- Gema/cristalinos (Sabiduría): Ojos en forma de gema tallada -->
    <!-- Gema izquierda -->
    <polygon points="185,185 215,205 205,240 165,240 155,205" fill="url(#eyes-11-gem)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="185,185 185,215 205,240" fill="var(--color-accent, #F5F340)" opacity="0.35"/>
    <polygon points="185,185 165,240 185,215" fill="#FFFFFF" opacity="0.4"/>

    <!-- Gema derecha -->
    <polygon points="327,185 357,205 347,240 307,240 297,205" fill="url(#eyes-11-gem)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="327,185 327,215 347,240" fill="var(--color-accent, #F5F340)" opacity="0.35"/>
    <polygon points="327,185 307,240 327,215" fill="#FFFFFF" opacity="0.4"/>

    <!-- Destello místico central -->
    <polygon points="256,195 260,210 275,215 260,220 256,235 252,220 237,215 252,210" fill="var(--color-accent, #F5F340)"/>
  </g>
</svg>