<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arch-product-v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#1B243B" />
    </linearGradient>
    <filter id="arch-product-v-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="arch-product" class="layer-7" transform="translate(410, 410)" filter="url(#arch-product-v-shadow)">
    <!-- 1. Contenedor con forma de tarjeta de roadmap / tablero opaco (0,0 a 80,80) -->
    <rect x="6" y="6" width="68" height="68" rx="14" fill="url(#arch-product-v-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3" />

    <!-- 2. Contenido interior escalado exactamente al tamaño y márgenes de los badges anteriores -->
    <g transform="translate(40, 40) scale(0.85) translate(-40, -40)">
      <!-- Marco interior decorativo -->
      <rect x="12" y="12" width="56" height="56" rx="9" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2" />

      <!-- Columnas del Kanban -->
      <line x1="28" y1="20" x2="28" y2="60" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="2 2" />
      <line x1="48" y1="20" x2="48" y2="60" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="2 2" />

      <!-- Tarjetas de tareas (Post-its del roadmap con colores corporativos) -->
      <!-- Columna 1: Backlog -->
      <rect x="16" y="22" width="9" height="12" rx="1.5" fill="var(--color-accent, #F5F340)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
      <rect x="16" y="38" width="9" height="10" rx="1.5" fill="#FFFFFF" opacity="0.8" stroke="var(--color-primary, #232D4B)" stroke-width="1" />

      <!-- Columna 2: In Progress -->
      <rect x="33" y="28" width="12" height="14" rx="1.5" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
      <line x1="36" y1="33" x2="42" y2="33" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
      <line x1="36" y1="37" x2="40" y2="37" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

      <!-- Columna 3: Done / Milestone -->
      <rect x="53" y="22" width="11" height="11" rx="2" fill="#2ED573" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
      <path d="M 56,27.5 L 58,29.5 L 61,24.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="53" y="44" width="11" height="12" rx="1.5" fill="var(--color-accent, #F5F340)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />

      <!-- Línea de flujo de estrategia -->
      <path d="M 20,28 C 28,28 35,35 39,35" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="2" stroke-linecap="round" />
      <path d="M 45,35 C 50,35 55,27 58,27" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 3. Detalle de acento -->
    <circle cx="64" cy="16" r="3" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>