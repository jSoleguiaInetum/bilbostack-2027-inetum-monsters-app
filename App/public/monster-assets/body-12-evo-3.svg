<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-12-evo-3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="#1B2838"/>
    </linearGradient>
    <linearGradient id="body-12-evo-3-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
    <radialGradient id="body-12-evo-3-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7B4"/>
      <stop offset="60%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </radialGradient>
  </defs>
  <g id="body-12-evo-3" class="layer-2">
    <ellipse cx="256" cy="458" rx="178" ry="29" fill="var(--color-primary, #232D4B)" opacity="0.42"/>

    <!-- Aletas cibernéticas de plasma hidro-cuánticas (+15%) -->
    <g id="body-12-evo-3-flippers">
      <path d="M125,270 C60,245 5,280 -10,340 C40,370 105,338 138,300 Z" fill="url(#body-12-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="5" cy="340" r="6" fill="var(--color-accent, #F5F340)"/>
      <path d="M387,270 C452,245 507,280 522,340 C472,370 407,338 374,300 Z" fill="url(#body-12-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="507" cy="340" r="6" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Caparazón definitivo (+15% bounding box) -->
    <path d="M256,95 C350,95 438,140 455,230 C472,320 442,412 380,438 C320,455 192,455 132,438 C70,412 40,320 57,230 C74,140 162,95 256,95 Z" fill="url(#body-12-evo-3-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Corona imperial de titanio de alta energía -->
    <g id="body-12-evo-3-crown">
      <path d="M200,98 L256,35 L312,98 Z" fill="url(#body-12-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="256" cy="35" r="7.5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Plastrón pectoral con reactor cuántico anfibio (y >= 285) -->
    <g id="body-12-evo-3-chest">
      <path d="M180,300 L256,280 L332,300 L312,392 L256,410 L200,392 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="256" cy="348" r="16" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="3"/>
      <circle cx="256" cy="348" r="10" fill="url(#body-12-evo-3-core)"/>
      <circle cx="253" cy="345" r="4" fill="#FFF7B4"/>
    </g>
  </g>
</svg>