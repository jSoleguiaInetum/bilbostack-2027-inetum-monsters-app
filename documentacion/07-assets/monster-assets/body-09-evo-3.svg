<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-09-evo-3-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="#2B1840"/>
    </linearGradient>
    <linearGradient id="body-09-evo-3-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
    <radialGradient id="body-09-evo-3-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7B4"/>
      <stop offset="60%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </radialGradient>
  </defs>
  <g id="body-09-evo-3" class="layer-2">
    <ellipse cx="256" cy="455" rx="160" ry="28" fill="var(--color-primary, #232D4B)" opacity="0.4"/>

    <!-- Elitros desplegados y alas de plasma cibernéticas (+15%) -->
    <g id="body-09-evo-3-wings">
      <path d="M120,230 C60,170 10,100 35,45 C75,60 110,120 140,180 Z" fill="url(#body-09-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="35" cy="45" r="5.5" fill="var(--color-accent, #F5F340)"/>
      <path d="M392,230 C452,170 502,100 477,45 C437,60 402,120 372,180 Z" fill="url(#body-09-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="477" cy="45" r="5.5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Exoesqueleto definitivo (+15%) -->
    <path d="M256,80 C328,80 395,125 418,200 C442,288 424,380 378,425 C330,452 256,460 256,460 C256,460 182,452 134,425 C88,380 70,288 94,200 C117,125 184,80 256,80 Z" fill="url(#body-09-evo-3-shell)" stroke="var(--color-primary, #232D4B)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Corona/Tenaza titanica imperial -->
    <g id="body-09-evo-3-crown">
      <path d="M200,85 L155,15 L215,55 Z" fill="url(#body-09-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3"/>
      <path d="M312,85 L357,15 L297,55 Z" fill="url(#body-09-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3"/>
      <circle cx="256" cy="25" r="7.5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Armadura ventral blindada con reactor cibernético (y >= 285) -->
    <g id="body-09-evo-3-chest">
      <path d="M185,305 L256,288 L327,305 L310,385 L256,402 L202,385 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="256" cy="345" r="15" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2.5"/>
      <circle cx="256" cy="345" r="9" fill="url(#body-09-evo-3-core)"/>
      <circle cx="253" cy="342" r="3.5" fill="#FFF7B4"/>
    </g>
  </g>
</svg>