<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-05-evo-1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="65%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-05-evo-1-crystal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8F5FF"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
  </defs>
  <g id="body-05-evo-1" class="layer-2">
    <!-- 1. Sombra proyectada -->
    <ellipse cx="256" cy="438" rx="125" ry="21" fill="var(--color-primary, #232D4B)" opacity="0.25"/>

    <!-- 2. Cristal principal facetado -->
    <path d="M256,90 L368,168 L350,375 L162,375 L144,168 Z" fill="url(#body-05-evo-1-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>

    <!-- 3. Cresta de cristal superior (fuera de zona de ojos) -->
    <polygon points="256,90 235,55 277,55" fill="url(#body-05-evo-1-crystal)" stroke="var(--color-accent, #F5F340)" stroke-width="2"/>
    <circle cx="256" cy="55" r="4" fill="var(--color-secondary, #E20074)"/>

    <!-- 4. Sub-placa pectoral de contención (respetando zona protegida en y >= 285) -->
    <g id="body-05-evo-1-chest">
      <polygon points="220,290 292,290 282,355 230,355" fill="var(--color-primary, #232D4B)" stroke="#B8F5FF" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="256" cy="322" r="6" fill="var(--color-accent, #F5F340)" stroke="var(--color-secondary, #E20074)" stroke-width="1.5"/>
    </g>

    <!-- 5. Facetas de luz -->
    <polygon points="256,90 256,375 368,168" fill="var(--color-accent, #F5F340)" opacity="0.2"/>
    <path d="M256,90 L368,168 L350,375 L162,375 L144,168 Z" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="3" opacity="0.5"/>
  </g>
</svg>