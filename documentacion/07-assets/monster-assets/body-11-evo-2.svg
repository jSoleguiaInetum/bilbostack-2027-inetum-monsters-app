<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-11-evo-2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="60%" stop-color="#2B1840"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-11-evo-2-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB9FE"/>
      <stop offset="50%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="100%" stop-color="#2B1840"/>
    </linearGradient>
  </defs>
  <g id="body-11-evo-2" class="layer-2">
    <ellipse cx="256" cy="445" rx="132" ry="22" fill="var(--color-primary, #232D4B)" opacity="0.35"/>

    <!-- Orejas de felino místico hiper-desarrolladas -->
    <g id="body-11-evo-2-ears">
      <path d="M165,135 L100,35 L195,100 Z" fill="url(#body-11-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="100" cy="35" r="5" fill="var(--color-accent, #F5F340)"/>
      <path d="M347,135 L412,35 L317,100 Z" fill="url(#body-11-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="412" cy="35" r="5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Torso expandido (+10%) -->
    <path d="M188,120 C222,98 290,98 324,120 C368,148 388,220 376,298 C364,375 334,432 256,438 C178,432 148,375 136,298 C124,220 144,148 188,120 Z" fill="url(#body-11-evo-2-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="4" stroke-linejoin="round"/>

    <!-- Hombreras felinas místicas laterales -->
    <g id="body-11-evo-2-shoulders">
      <path d="M140,210 L65,150 L115,125 L165,170 Z" fill="url(#body-11-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="3"/>
      <path d="M372,210 L447,150 L397,125 L347,170 Z" fill="url(#body-11-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="3"/>
    </g>

    <!-- Coraza del pectoral en y >= 285 -->
    <g id="body-11-evo-2-chest">
      <path d="M190,298 L256,282 L322,298 L305,372 L256,388 L207,372 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="256" cy="338" r="10" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="2"/>
      <circle cx="256" cy="338" r="5" fill="var(--color-secondary, #E20074)"/>
    </g>
  </g>
</svg>