<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-15-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="60%" stop-color="#241B35"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-15-hex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB9FE"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
  </defs>
  <g id="body-15" class="layer-2">
    <!-- Sombra de estructura en panal -->
    <ellipse cx="256" cy="438" rx="140" ry="20" fill="var(--color-primary, #232D4B)" opacity="0.32"/>

    <!-- Nodos hexagonales laterales flotantes -->
    <g id="body-15-honeycombs">
      <polygon points="110,230 135,215 160,230 160,260 135,275 110,260" fill="url(#body-15-hex)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
      <polygon points="352,230 377,215 402,230 402,260 377,275 352,260" fill="url(#body-15-hex)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
    </g>

    <!-- Silueta principal: Hexágono regular (6 lados, punta arriba, más ancho que alto) -->
    <!-- Puntos: Top(256, 130), TopRight(380, 202), BottomRight(380, 346), Bottom(256, 418), BottomLeft(132, 346), TopLeft(132, 202) -->
    <polygon points="256,130 380,202 380,346 256,418 132,346 132,202" 
             fill="url(#body-15-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Patrón de celdas hexagonales grabadas en el chasis -->
    <polygon points="256,170 280,183 280,210 256,223 232,210 232,183" fill="none" stroke="#8BB9FE" stroke-width="2" opacity="0.6"/>
    <polygon points="210,245 234,258 234,285 210,298 186,285 186,258" fill="none" stroke="#8BB9FE" stroke-width="1.8" opacity="0.6"/>
    <polygon points="302,245 326,258 326,285 302,298 278,285 278,258" fill="none" stroke="#8BB9FE" stroke-width="1.8" opacity="0.6"/>

    <!-- Antena o nodo superior de enjambre (y < 130) -->
    <polygon points="245,130 256,85 267,130" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2"/>
    <circle cx="256" cy="85" r="4.5" fill="var(--color-secondary, #E20074)"/>

    <!-- Placa pectoral modular inferior (y >= 275) -->
    <g id="body-15-chest">
      <polygon points="210,310 302,310 288,385 224,385" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="256" cy="347" r="6" fill="var(--color-accent, #F5F340)" stroke="var(--color-secondary, #E20074)" stroke-width="1.5"/>
    </g>
  </g>
</svg>