<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arch-developer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#181E32" />
    </linearGradient>
    <filter id="arch-developer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="arch-developer" class="layer-7" transform="translate(410, 410)" filter="url(#arch-developer-shadow)">
    <!-- 1. Contenedor hexagonal opaco de fondo (0,0 a 80,80) -->
    <polygon points="40,4 74,22 74,58 40,76 6,58 6,22" fill="url(#arch-developer-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round" />

    <!-- 2. Marco tech decorativo interior -->
    <polygon points="40,9 69,25 69,55 40,71 11,55 11,25" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2" stroke-linejoin="round" />

    <!-- 3. Icono Developer: Símbolo </> dibujado con paths vectoriales puros -->
    <!-- Ángulo izquierdo '<' -->
    <polyline points="28,28 18,40 28,52" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Barra diagonal '/' -->
    <line x1="44" y1="26" x2="36" y2="54" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- Ángulo derecho '>' -->
    <polyline points="52,28 62,40 52,52" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 4. Detalle de acento de estado -->
    <circle cx="40" cy="14" r="2.5" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>