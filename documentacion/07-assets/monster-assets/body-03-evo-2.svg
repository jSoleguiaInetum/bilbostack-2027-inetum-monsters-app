<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-03-evo-2-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="50%" stop-color="#2B1840"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-03-evo-2-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB9FE"/>
      <stop offset="50%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="100%" stop-color="#2B1840"/>
    </linearGradient>
    <radialGradient id="body-03-evo-2-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </radialGradient>
  </defs>
  <g id="body-03-evo-2" class="layer-2">
    <!-- Sombra magnética flotante amplia -->
    <ellipse cx="256" cy="448" rx="115" ry="20" fill="var(--color-primary, #232D4B)" opacity="0.35"/>

    <!-- Anillos de campo electromagnético doble -->
    <ellipse cx="256" cy="225" rx="210" ry="55" fill="none" stroke="#8BB9FE" stroke-width="2.5" stroke-dasharray="12 8" opacity="0.7" transform="rotate(-12 256 225)"/>
    <ellipse cx="256" cy="225" rx="190" ry="45" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="1.5" opacity="0.5" transform="rotate(12 256 225)"/>

    <!-- Aletas electromagnéticas dobles articuladas -->
    <g id="body-03-evo-2-wings">
      <path d="M165,240 L80,180 L110,270 L170,290 Z" fill="url(#body-03-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>
      <path d="M150,190 L90,140 L115,200 Z" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="1.5"/>
      <circle cx="80" cy="180" r="4.5" fill="var(--color-accent, #F5F340)"/>

      <path d="M347,240 L432,180 L402,270 L342,290 Z" fill="url(#body-03-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5"/>
      <path d="M362,190 L422,140 L397,200 Z" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="1.5"/>
      <circle cx="432" cy="180" r="4.5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Silueta principal bivalva expandida (+10% bounding box) -->
    <path d="M256,50 C320,50 375,108 392,192 C410,278 388,368 355,412 C325,445 288,450 256,445 C224,450 187,445 157,412 C124,368 102,278 120,192 C137,108 192,50 256,50 Z" fill="url(#body-03-evo-2-shell)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5"/>

    <!-- Corona de sensores superiores -->
    <g id="body-03-evo-2-crest">
      <path d="M232,50 L256,15 L280,50 Z" fill="url(#body-03-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
      <circle cx="256" cy="15" r="5" fill="var(--color-accent, #F5F340)"/>
      <path d="M210,75 L225,40 L238,68 Z" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="1.5"/>
      <path d="M302,75 L287,40 L274,68 Z" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="1.5"/>
    </g>

    <!-- Cavidad interna central -->
    <path d="M256,120 C300,120 332,162 332,225 C332,288 300,330 256,330 C212,330 180,288 180,225 C180,162 212,120 256,120 Z" fill="#1A102F" stroke="var(--color-secondary, #E20074)" stroke-width="3"/>

    <!-- Núcleo de plasma hiper-reactivo -->
    <ellipse cx="256" cy="275" rx="42" ry="25" fill="url(#body-03-evo-2-glow)" opacity="0.85"/>

    <!-- Blindaje Pectoral Reforzado (respetando zona protegida y=170-270) -->
    <g id="body-03-evo-2-chest">
      <path d="M210,290 L256,278 L302,290 L290,360 L256,372 L222,360 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="256" cy="325" r="10" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="2"/>
      <circle cx="256" cy="325" r="5" fill="var(--color-secondary, #E20074)"/>
      <line x1="222" y1="310" x2="290" y2="310" stroke="#8BB9FE" stroke-width="1.5"/>
    </g>

    <!-- Highlight de volumen -->
    <path d="M256,65 C300,65 345,102 360,162 C340,145 305,135 256,135 C207,135 172,145 152,162 C167,102 212,65 256,65 Z" fill="#FFF7B4" opacity="0.3"/>
  </g>
</svg>