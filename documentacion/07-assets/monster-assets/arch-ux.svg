<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arch-ux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#241B35" />
    </linearGradient>
    <filter id="arch-ux-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="arch-ux" class="layer-7" transform="translate(410, 410)" filter="url(#arch-ux-shadow)">
    <!-- 1. Contenedor con forma de paleta de pintor artística (orgánica con muesca y orificio) -->
    <path d="M 40,6 C 62,6 74,20 74,40 C 74,58 60,74 40,74 C 20,74 6,58 6,40 C 6,22 18,10 26,16 C 30,19 32,25 36,25 C 40,25 42,18 40,12 Z" fill="url(#arch-ux-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round" />

    <!-- 2. Marco interior / borde decorativo de la paleta -->
    <path d="M 40,12 C 58,12 68,24 68,40 C 68,54 54,68 40,68 C 24,68 12,54 12,40 C 12,26 22,16 28,21 C 32,24 35,30 40,30 C 45,30 47,23 42,16 Z" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2" stroke-linejoin="round" />

    <!-- Orificio para el dedo -->
    <ellipse cx="24" cy="52" rx="5" ry="4" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="1.5" />

    <!-- 3. Iconos: Pincel a la izquierda y Cursor desplazado a la izquierda y abajo -->
    <!-- Pincel inclinado a la izquierda -->
    <g transform="rotate(18 26 35)">
      <path d="M 23,10 L 29,10 C 30,10 31,11 31,12 L 29,36 L 23,36 L 21,12 C 21,11 22,10 23,10 Z" fill="var(--color-accent, #F5F340)" stroke="var(--color-primary, #232D4B)" stroke-width="1.5" />
      <rect x="22" y="36" width="8" height="5" fill="#8BB9FE" stroke="var(--color-primary, #232D4B)" stroke-width="1.5" />
      <path d="M 22,41 L 30,41 C 30,46 26,50 26,50 C 26,50 22,46 22,41 Z" fill="#FFFFFF" stroke="var(--color-primary, #232D4B)" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Cursor de interfaz desplazado a la izquierda y abajo -->
    <polygon points="64,26 64,56 58,49 53,58 49,55 54,46 48,46" fill="#FFFFFF" stroke="var(--color-primary, #232D4B)" stroke-width="2" stroke-linejoin="round" />

    <!-- 4. Detalles de acento artístico (gotas de pintura) -->
    <circle cx="54" cy="22" r="3" fill="var(--color-accent, #F5F340)" />
    <circle cx="62" cy="30" r="2.5" fill="var(--color-secondary, #E20074)" />
  </g>
</svg>