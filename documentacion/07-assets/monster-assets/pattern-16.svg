<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="pattern-16-clip">
      <rect x="76" y="100" width="360" height="360"/>
    </clipPath>
  </defs>
  <g id="pattern-16" class="layer-3" clip-path="url(#pattern-16-clip)" opacity="0.35">
    <!-- Constelaciones (Puntos estelares conectados por líneas finas) -->
    <!-- Constelación 1 Izquierda -->
    <line x1="140" y1="180" x2="190" y2="150" stroke="#8BB9FE" stroke-width="1.5"/>
    <line x1="190" y1="150" x2="230" y2="210" stroke="#8BB9FE" stroke-width="1.5"/>
    <line x1="230" y1="210" x2="160" y2="240" stroke="#8BB9FE" stroke-width="1.5"/>
    <line x1="160" y1="240" x2="140" y2="180" stroke="#8BB9FE" stroke-width="1.5"/>

    <!-- Constelación 2 Derecha/Centro -->
    <line x1="280" y1="180" x2="350" y2="140" stroke="#8BB9FE" stroke-width="1.5"/>
    <line x1="350" y1="140" x2="380" y2="220" stroke="#8BB9FE" stroke-width="1.5"/>
    <line x1="380" y1="220" x2="310" y2="260" stroke="#8BB9FE" stroke-width="1.5"/>
    <line x1="310" y1="260" x2="280" y2="180" stroke="#8BB9FE" stroke-width="1.5"/>

    <!-- Estrellas / Nodos -->
    <circle cx="140" cy="180" r="4" fill="var(--color-accent, #F5F340)"/>
    <circle cx="190" cy="150" r="5" fill="var(--color-secondary, #E20074)"/>
    <circle cx="230" cy="210" r="4" fill="var(--color-accent, #F5F340)"/>
    <circle cx="160" cy="240" r="4.5" fill="var(--color-primary, #232D4B)"/>

    <circle cx="280" cy="180" r="5" fill="var(--color-secondary, #E20074)"/>
    <circle cx="350" cy="140" r="4" fill="var(--color-accent, #F5F340)"/>
    <circle cx="380" cy="220" r="5" fill="var(--color-primary, #232D4B)"/>
    <circle cx="310" cy="260" r="4" fill="var(--color-accent, #F5F340)"/>
  </g>
</svg>