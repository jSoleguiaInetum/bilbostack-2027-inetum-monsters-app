<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente para la esfera del reloj -->
    <linearGradient id="acc-16-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151C33" />
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)" />
    </linearGradient>
    <!-- Sombra de flotación -->
    <filter id="acc-16-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <g id="acc-16" class="layer-6" transform="translate(130, 265)" filter="url(#acc-16-shadow)">
    <!-- Sombra elíptica de flotación inferior -->
    <ellipse cx="28" cy="62" rx="18" ry="4" fill="#000000" opacity="0.3" />
    
    <!-- Correa superior del smartwatch -->
    <rect x="22" y="6" width="12" height="16" rx="2" fill="var(--color-secondary, #E20074)" />
    
    <!-- Correa inferior del smartwatch -->
    <rect x="22" y="44" width="12" height="16" rx="2" fill="var(--color-secondary, #E20074)" />
    
    <!-- Caja principal del reloj (esfera cuadrada con esquinas redondeadas) -->
    <rect x="16" y="18" width="24" height="28" rx="6" fill="url(#acc-16-screen)" stroke="#C0CBDC" stroke-width="2" />
    
    <!-- Pantalla digital interior -->
    <rect x="19" y="21" width="18" height="22" rx="4" fill="#0B0F19" />
    
    <!-- Elementos de la interfaz / pantalla del smartwatch -->
    <!-- Hora digital -->
    <text x="28" y="30" font-family="monospace" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="bold">20:27</text>
    
    <!-- Gráfica de actividad / pulso cardíaco en miniatura -->
    <path d="M 21,37 L 24,37 L 25,34 L 27,40 L 29,35 L 31,37 L 35,37" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Botón lateral / Corona digital -->
    <rect x="40" y="27" width="2" height="10" rx="1" fill="#C0CBDC" />
  </g>
</svg>