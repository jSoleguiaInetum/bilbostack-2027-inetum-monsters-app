<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="acc-15-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#151C33" />
    </linearGradient>
    <filter id="acc-15-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <g id="acc-15" class="layer-6" transform="translate(130, 275)" filter="url(#acc-15-shadow)">
    <!-- Sombra de flotación inferior -->
    <ellipse cx="28" cy="58" rx="20" ry="4" fill="#000000" opacity="0.3" />
    
    <!-- Cuaderno / Libreta corporativa de management con tira amarilla -->
    <rect x="10" y="12" width="36" height="44" rx="3" fill="url(#acc-15-cover)" stroke="var(--color-secondary, #E20074)" stroke-width="2" />
    
    <!-- Espiral gris metálica (anillas continuas en el lomo izquierdo) -->
    <path d="M 12,16 C 6,16 6,19 12,19 M 12,23 C 6,23 6,26 12,26 M 12,30 C 6,30 6,33 12,33 M 12,37 C 6,37 6,40 12,40 M 12,44 C 6,44 6,47 12,47 M 12,51 C 6,51 6,54 12,54" fill="none" stroke="#C0CBDC" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Líneas de notas / apuntes abstractos superiores -->
    <line x1="18" y1="20" x2="38" y2="20" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="18" y1="26" x2="34" y2="26" stroke="var(--color-accent, #F5F340)" stroke-width="1.2" stroke-linecap="round" />
    <line x1="18" y1="32" x2="36" y2="32" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <line x1="18" y1="38" x2="30" y2="38" stroke="var(--color-secondary, #E20074)" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- LOGO DE INETUM VECTORIZADO (bajado exactamente la mitad del espacio restante) -->
    <g transform="translate(29, 42.75)">
      <!-- Fondo cuadrado amarillo del logo -->
      <rect x="0" y="0" width="10" height="10" rx="1" fill="#F5F340" />
      <!-- Bloque inferior izquierdo -->
      <rect x="1.5" y="6" width="3" height="3" fill="#232D4B" />
      <!-- Bloques superiores derechos (forma escalonada / The Arrow) -->
      <rect x="5.5" y="1" width="3" height="3" fill="#232D4B" />
      <rect x="5.5" y="4" width="3" height="3" fill="#606C7D" />
      <rect x="2.5" y="1" width="3" height="3" fill="#323F59" />
    </g>
    
    <!-- Banda elástica / marcapáginas vertical amarillo -->
    <rect x="40" y="12" width="3" height="44" fill="var(--color-accent, #F5F340)" />
    
    <!-- Cuerpo principal del bolígrafo -->
    <path d="M 37,6 L 25,51" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 37,6 L 25,51" stroke="#C0CBDC" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Clip paralelo al bolígrafo, reducido a la mitad de largo -->
    <path d="M 39,8 L 36,19.25" stroke="var(--color-primary, #232D4B)" stroke-width="2" stroke-linecap="round" />
    <path d="M 39,8 L 36,19.25" stroke="#C0CBDC" stroke-width="1" stroke-linecap="round" />
    
    <!-- Línea azul superior bajada 1 cuarto de su longitud -->
    <line x1="37.5" y1="2.5" x2="36.9" y2="6.5" stroke="var(--color-primary, #232D4B)" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- Boquilla inferior (línea rosa) reducida a 2 tercios y asomando por abajo -->
    <line x1="24.9" y1="51.2" x2="24.2" y2="53.5" stroke="var(--color-secondary, #E20074)" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>