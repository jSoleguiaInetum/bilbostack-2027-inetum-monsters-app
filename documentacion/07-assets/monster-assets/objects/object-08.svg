<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="acc-08-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-secondary, #E20074)" />
      <stop offset="100%" stop-color="#9E0051" />
    </linearGradient>
    <filter id="acc-08-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <g id="acc-08" class="layer-6" transform="translate(360, 130)" filter="url(#acc-08-shadow)">
    <!-- Sombra de flotación inferior -->
    <ellipse cx="28" cy="54" rx="22" ry="5" fill="#000000" opacity="0.3" />
    
    <!-- 6 Patas articuladas estilo tech (3 a cada lado) -->
    <!-- Patas izquierdas -->
    <path d="M 16,24 L 6,18" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="2" stroke-linecap="round" />
    <path d="M 14,32 L 4,32" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="2" stroke-linecap="round" />
    <path d="M 16,40 L 6,46" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Patas derechas -->
    <path d="M 40,24 L 50,18" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="2" stroke-linecap="round" />
    <path d="M 42,32 L 52,32" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="2" stroke-linecap="round" />
    <path d="M 40,40 L 50,46" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Cuerpo principal del bicho (abdomen ovalado) -->
    <ellipse cx="28" cy="32" rx="14" ry="16" fill="url(#acc-08-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="2" />
    
    <!-- Patrón ortogonal estilo circuitos (PCB tracks en ángulo recto) -->
    <path d="M 28,20 L 28,42 M 22,26 L 34,26 M 20,34 L 36,34" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" />
    <!-- Vías / nodos de circuitos -->
    <circle cx="28" cy="20" r="2" fill="var(--color-accent, #F5F340)" />
    <circle cx="22" cy="26" r="1.5" fill="var(--color-accent, #F5F340)" />
    <circle cx="34" cy="26" r="1.5" fill="var(--color-accent, #F5F340)" />
    <circle cx="20" cy="34" r="1.5" fill="var(--color-accent, #F5F340)" />
    <circle cx="36" cy="34" r="1.5" fill="var(--color-accent, #F5F340)" />

    <!-- Cabeza tecnológica con visera o ojos -->
    <circle cx="28" cy="14" r="7" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="1.2" />
    <circle cx="25" cy="13" r="1.5" fill="var(--color-accent, #F5F340)" />
    <circle cx="31" cy="13" r="1.5" fill="var(--color-accent, #F5F340)" />
    
    <!-- Antenas con LED corporativo -->
    <path d="M 24,9 L 18,3" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="17" cy="2" r="2" fill="var(--color-accent, #F5F340)" />
    <path d="M 32,9 L 38,3" fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="39" cy="2" r="2" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>