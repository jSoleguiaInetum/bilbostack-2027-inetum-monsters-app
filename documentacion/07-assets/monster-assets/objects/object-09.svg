<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="acc-09-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#0F1524" />
    </linearGradient>
    <linearGradient id="acc-09-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C385C" />
      <stop offset="100%" stop-color="#1A2238" />
    </linearGradient>
    <filter id="acc-09-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <g id="acc-09" class="layer-6" transform="translate(210, 85)" filter="url(#acc-09-shadow)">
    <!-- Sombra de flotación inferior ajustada -->
    <ellipse cx="48" cy="58" rx="28" ry="5" fill="#000000" opacity="0.3" />
    
    <!-- Pantalla del portátil (más alta y compacta en anchura) -->
    <path d="M 28,4 L 68,4 C 70,4 72,6 72,8 L 72,40 C 72,42 70,44 68,44 L 28,44 C 26,44 24,42 24,40 L 24,8 C 24,6 26,4 28,4 Z" fill="url(#acc-09-screen)" stroke="var(--color-secondary, #E20074)" stroke-width="2" />
    
    <!-- Líneas de código simuladas en la pantalla vertical -->
    <line x1="30" y1="14" x2="44" y2="14" stroke="var(--color-accent, #F5F340)" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="22" x2="60" y2="22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="30" x2="48" y2="30" stroke="var(--color-secondary, #E20074)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Base / Teclado del portátil (proporcionada al nuevo ancho) -->
    <path d="M 16,46 L 80,46 C 82,46 83,48 82,50 L 76,54 C 75,55 74,56 72,56 L 24,56 C 22,56 21,55 20,54 L 14,50 C 13,48 14,46 16,46 Z" fill="url(#acc-09-body)" stroke="var(--color-primary, #232D4B)" stroke-width="1.5" />
    
    <!-- Área de teclado y LED central -->
    <rect x="24" y="48" width="48" height="4" rx="1" fill="#151C33" />
    <circle cx="48" cy="53" r="1" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>