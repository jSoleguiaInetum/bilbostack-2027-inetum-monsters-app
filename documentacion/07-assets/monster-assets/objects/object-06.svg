<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="acc-06-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#151C33" />
    </linearGradient>
    <filter id="acc-06-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <g id="acc-06" class="layer-6" transform="translate(200, 70)" filter="url(#acc-06-shadow)">
    <!-- Sombra de flotación inferior -->
    <ellipse cx="48" cy="62" rx="36" ry="6" fill="#000000" opacity="0.3" />
    
    <!-- Doble arco / Diadema futurista exagerada -->
    <path d="M 12,38 C 12,10 32,2 48,2 C 64,2 84,10 84,38" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 18,36 C 18,16 34,8 48,8 C 62,8 78,16 78,36" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Copas / Auriculares grandes y robustos estilo gaming/DJ -->
    <rect x="4" y="26" width="16" height="30" rx="6" fill="url(#acc-06-grad)" stroke="var(--color-accent, #F5F340)" stroke-width="2" />
    <rect x="76" y="26" width="16" height="30" rx="6" fill="url(#acc-06-grad)" stroke="var(--color-accent, #F5F340)" stroke-width="2" />
    
    <!-- Anillos LED laterales en las copas -->
    <circle cx="12" cy="41" r="4" fill="var(--color-secondary, #E20074)" />
    <circle cx="84" cy="41" r="4" fill="var(--color-secondary, #E20074)" />
    
    <!-- Micrófono de asta (boom mic) característico -->
    <path d="M 12,56 C 12,64 24,62 30,58" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="32" cy="56" r="2.5" fill="var(--color-accent, #F5F340)" />
  </g>
</svg>