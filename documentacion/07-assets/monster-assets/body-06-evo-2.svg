      <path d="M225,392 C210,440 190,470 170,460 C160,455 180,420 200,395 Z" fill="url(#body-06-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
      
      <path d="M287,392 C302,440 322,470 342,460 C352,455 332,420 312,395 Z" fill="url(#body-06-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
      <path d="M312,388 C332,435 357,465 377,455 C387,450 367,415 342,392 Z" fill="url(#body-06-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
      <path d="M337,380 C362,420 387,450 412,440 C422,435 402,405 372,388 Z" fill="url(#body-06-evo-2-plate)" stroke="var(--color-primary, #232D4B)" stroke-width="2"/>
