      <circle cx="437" cy="425" r="3.5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <path d="M172,398 C122,332 105,200 172,140 C210,100 302,100 340,140 C407,200 390,332 340,398 C294,430 218,430 172,398 Z" fill="url(#body-06-evo-2-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3.5" stroke-linejoin="round"/>
    <g id="body-06-evo-2-crest">
