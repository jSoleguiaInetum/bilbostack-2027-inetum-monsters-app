<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arch-multi-opt3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)" />
      <stop offset="100%" stop-color="#1B243B" />
    </linearGradient>
    <filter id="arch-multi-opt3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="arch-multiclass" class="layer-7" transform="translate(410, 410)" filter="url(#arch-multi-opt3-shadow)">
    <!-- 1. Contenedor exterior: Círculo con borde dashed (fusión, sin forma fija) -->
    <circle cx="40" cy="40" r="36" fill="url(#arch-multi-opt3-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3"/>
    <circle cx="40" cy="40" r="36" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7"/>

    <!-- 2. Contenido interior escalado con exactitud al estándar (0.85) -->
    <g transform="translate(40, 40) scale(0.85) translate(-40, -40)">
      <!-- Marco interior decorativo circular -->
      <circle cx="40" cy="40" r="27" fill="none" stroke="var(--color-secondary, #E20074)" stroke-width="2"/>

      <!-- Icono interior: Tres nodos interconectados -->
      <!-- Líneas conectoras de fondo -->
      <line x1="40" y1="28" x2="28" y2="48" stroke="var(--color-accent, #F5F340)" stroke-width="2" stroke-linecap="round" />
      <line x1="40" y1="28" x2="52" y2="48" stroke="var(--color-accent, #F5F340)" stroke-width="2" stroke-linecap="round" />
      <line x1="28" y1="48" x2="52" y2="48" stroke="var(--color-accent, #F5F340)" stroke-width="2" stroke-linecap="round" />

      <!-- Nodo superior -->
      <circle cx="40" cy="28" r="8" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1.5" />
      <circle cx="40" cy="28" r="3" fill="#FFFFFF" />

      <!-- Nodo inferior izquierdo con varias líneas interiores en lugar de un punto -->
      <g transform="translate(28, 48)">
        <circle cx="0" cy="0" r="8" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="1.5" />
        <line x1="-4" y1="-3" x2="4" y2="-3" stroke="var(--color-secondary, #E20074)" stroke-width="1.5" stroke-linecap="round" />
        <line x1="-4" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
        <line x1="-4" y1="3" x2="4" y2="3" stroke="var(--color-accent, #F5F340)" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Nodo inferior derecho: Rueda dentada amarilla con dientes cuadrados exactos en el perímetro -->
      <g transform="translate(52, 48)">
        <circle cx="0" cy="0" r="7" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="1.8" />
        <circle cx="0" cy="0" r="2.5" fill="var(--color-primary, #232D4B)" stroke="var(--color-secondary, #E20074)" stroke-width="0.8" />
        
        <!-- Dientes cuadrados (2x2) distribuidos exactamente en el perímetro radial -->
        <rect x="-1" y="-9" width="2" height="2" fill="var(--color-accent, #F5F340)" rx="0.3" />
        <rect x="-1" y="-9" width="2" height="2" transform="rotate(45)" fill="var(--color-accent, #F5F340)" rx="0.3" />
        <rect x="-1" y="-9" width="2" height="2" transform="rotate(90)" fill="var(--color-accent, #F5F340)" rx="0.3" />
        <rect x="-1" y="-9" width="2" height="2" transform="rotate(135)" fill="var(--color-accent, #F5F340)" rx="0.3" />
        <rect x="-1" y="-9" width="2" height="2" transform="rotate(180)" fill="var(--color-accent, #F5F340)" rx="0.3" />
        <rect x="-1" y="-9" width="2" height="2" transform="rotate(225)" fill="var(--color-accent, #F5F340)" rx="0.3" />
        <rect x="-1" y="-9" width="2" height="2" transform="rotate(270)" fill="var(--color-accent, #F5F340)" rx="0.3" />
        <rect x="-1" y="-9" width="2" height="2" transform="rotate(315)" fill="var(--color-accent, #F5F340)" rx="0.3" />
      </g>
    </g>

    <!-- 3. Detalles de acento auxiliares -->
    <circle cx="64" cy="16" r="3" fill="var(--color-accent, #F5F340)" />
    <circle cx="16" cy="64" r="2.2" fill="var(--color-secondary, #E20074)" stroke="var(--color-primary, #232D4B)" stroke-width="1" />
  </g>
</svg>