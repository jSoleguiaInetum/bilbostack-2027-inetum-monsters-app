<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-04-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="65%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-04-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB9FE"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
    <radialGradient id="body-04-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </radialGradient>
  </defs>
  <g id="body-04" class="layer-2">
    <!-- 1. Sombra proyectada en el suelo -->
    <ellipse cx="256" cy="435" rx="125" ry="22" fill="var(--color-primary, #232D4B)" opacity="0.25"/>

    <!-- 2. Hombreras mecánicas laterales de base -->
    <path d="M165,245 C135,225 125,185 145,165 C165,185 175,215 170,240 Z" fill="url(#body-04-metal)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M347,245 C377,225 387,185 367,165 C347,185 337,215 342,240 Z" fill="url(#body-04-metal)" stroke="var(--color-primary, #232D4B)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 3. Silueta principal: Chasis esférico acorazado con 12 comandos de curva C -->
    <path d="M256,120 
             C305,120 350,145 375,185 
             C400,225 405,280 385,330 
             C365,380 315,420 256,425 
             C197,420 147,380 127,330 
             C107,280 112,225 137,185 
             C162,145 207,120 256,120 Z" 
          fill="url(#body-04-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>

    <!-- 4. Capa de highlight volumétrico superior -->
    <path d="M256,135 
             C295,135 330,155 352,190 
             C330,180 295,175 256,175 
             C217,175 182,180 160,190 
             C182,155 217,135 256,135 Z" 
          fill="var(--color-accent, #F5F340)" opacity="0.3"/>

    <!-- 5. Capa de sombra profunda inferior -->
    <path d="M150,345 
             C180,390 220,410 256,412 
             C292,410 332,390 362,345 
             C330,375 295,390 256,390 
             C217,390 182,375 150,345 Z" 
          fill="var(--color-primary, #232D4B)" opacity="0.35"/>

    <!-- 6. Núcleo cibernético central integrado -->
    <circle cx="256" cy="275" r="42" fill="#2B1840" stroke="var(--color-secondary, #E20074)" stroke-width="2.5"/>
    <circle cx="256" cy="275" r="28" fill="url(#body-04-glow)" opacity="0.75"/>

    <!-- 7. Placas de blindaje segmentadas con remaches -->
    <path d="M200,200 L256,175 L312,200" fill="none" stroke="#8BB9FE" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="200" cy="200" r="3" fill="var(--color-accent, #F5F340)"/>
    <circle cx="312" cy="200" r="3" fill="var(--color-accent, #F5F340)"/>

    <!-- 8. Borde de definición maestro -->
    <path d="M256,120 
             C305,120 350,145 375,185 
             C400,225 405,280 385,330 
             C365,380 315,420 256,425 
             C197,420 147,380 127,330 
             C107,280 112,225 137,185 
             C162,145 207,120 256,120 Z" 
          fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="3" opacity="0.5"/>
  </g>
</svg>