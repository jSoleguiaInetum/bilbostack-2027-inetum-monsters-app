<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-11-evo-3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="#2B1840"/>
    </linearGradient>
    <linearGradient id="body-11-evo-3-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
    <radialGradient id="body-11-evo-3-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7B4"/>
      <stop offset="60%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </radialGradient>
  </defs>
  <g id="body-11-evo-3" class="layer-2">
    <ellipse cx="256" cy="452" rx="145" ry="25" fill="var(--color-primary, #232D4B)" opacity="0.4"/>

    <!-- Auras/Alas felinas de plasma etéreo en los costados (+15%) -->
    <g id="body-11-evo-3-aura">
      <path d="M135,220 C70,160 10,95 35,40 C75,55 110,120 140,180 Z" fill="url(#body-11-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="35" cy="40" r="5.5" fill="var(--color-accent, #F5F340)"/>
      <path d="M377,220 C442,160 502,95 477,40 C437,55 402,120 372,180 Z" fill="url(#body-11-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="477" cy="40" r="5.5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Torso místico definitivo (+15%) -->
    <path d="M180,108 C220,85 292,85 332,108 C378,138 400,215 386,298 C372,380 340,442 256,448 C172,442 140,380 126,298 C112,215 134,138 180,108 Z" fill="url(#body-11-evo-3-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Corona felina imperial superior -->
    <g id="body-11-evo-3-crown">
      <path d="M165,115 L90,20 L190,85 Z" fill="url(#body-11-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3"/>
      <circle cx="90" cy="20" r="6" fill="var(--color-accent, #F5F340)"/>
      <path d="M347,115 L422,20 L322,85 Z" fill="url(#body-11-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3"/>
      <circle cx="422" cy="20" r="6" fill="var(--color-accent, #F5F340)"/>
      <circle cx="256" cy="25" r="7.5" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Reactor pectoral astronómico (y >= 285) -->
    <g id="body-11-evo-3-chest">
      <path d="M185,302 L256,285 L327,302 L310,382 L256,398 L202,382 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="256" cy="342" r="15" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2.5"/>
      <circle cx="256" cy="342" r="9" fill="url(#body-11-evo-3-core)"/>
      <circle cx="253" cy="339" r="3.5" fill="#FFF7B4"/>
    </g>
  </g>
</svg>