<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-16-evo-2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="50%" stop-color="#2C1B4D"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-16-evo-2-crystal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB9FE"/>
      <stop offset="50%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="100%" stop-color="#2B1840"/>
    </linearGradient>
  </defs>
  <g id="body-16-evo-2" class="layer-2">
    <ellipse cx="256" cy="448" rx="135" ry="20" fill="var(--color-primary, #232D4B)" opacity="0.35"/>

    <!-- Fragmentos de cuarzo satélites expandidos (+10%) -->
    <g id="body-16-evo-2-shards">
      <polygon points="100,230 65,175 115,190" fill="url(#body-16-evo-2-crystal)" stroke="var(--color-primary, #232D4B)" stroke-width="3"/>
      <circle cx="65" cy="175" r="4" fill="var(--color-accent, #F5F340)"/>
      <polygon points="412,230 447,175 397,190" fill="url(#body-16-evo-2-crystal)" stroke="var(--color-primary, #232D4B)" stroke-width="3"/>
      <circle cx="447" cy="175" r="4" fill="var(--color-accent, #F5F340)"/>
    </g>

    <!-- Estrella de 6 puntas expandida Evo 2 (+10% bounding box: exterior r=192, interior r=108) -->
    <polygon points="256,64 314,151 424,151 353,230 378,338 256,290 134,338 159,230 88,151 198,151" 
             fill="url(#body-16-evo-2-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="4" stroke-linejoin="round"/>
             
    <polygon points="256,64 256,290 424,151" fill="var(--color-accent, #F5F340)" opacity="0.25"/>

    <!-- Corona de cristal superior -->
    <g id="body-16-evo-2-crest">
      <polygon points="220,64 256,15 292,64" fill="url(#body-16-evo-2-crystal)" stroke="var(--color-accent, #F5F340)" stroke-width="2.5"/>
      <circle cx="256" cy="15" r="6" fill="var(--color-secondary, #E20074)"/>
    </g>

    <!-- Armadura pectoral reforzada (y >= 275) -->
    <g id="body-16-evo-2-chest">
      <polygon points="190,295 322,295 302,385 210,385" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="256" cy="340" r="10" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="2"/>
      <circle cx="256" cy="340" r="5" fill="var(--color-secondary, #E20074)"/>
    </g>
  </g>
</svg>