<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-03-shell-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="50%" stop-color="#2B1840"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
    <linearGradient id="body-03-core-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
  </defs>
  <g id="body-03" class="layer-2">
    <!-- 1. Sombra magnética flotante en el suelo -->
    <ellipse cx="256" cy="440" rx="90" ry="15" fill="var(--color-primary, #232D4B)" opacity="0.3"/>

    <!-- 2. Aletas magnéticas estabilizadoras traseras -->
    <path d="M170,240 L110,210 L130,280 L175,290 Z" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="2" opacity="0.8"/>
    <path d="M342,240 L402,210 L382,280 L337,290 Z" fill="var(--color-primary, #232D4B)" stroke="#8BB9FE" stroke-width="2" opacity="0.8"/>

    <!-- 3. Silueta principal: Caparazón bivalvo exterior (Ojiva flotante) -->
    <path d="M256,70 
             C310,70 360,120 375,200 
             C390,280 370,360 340,400 
             C315,430 285,435 256,430 
             C227,435 197,430 172,400 
             C142,360 122,280 137,200 
             C152,120 202,70 256,70 Z" 
          fill="url(#body-03-shell-grad)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>

    <!-- 4. Cavidad interna / Ventana de energía central -->
    <path d="M256,130 
             C295,130 325,170 325,230 
             C325,290 295,330 256,330 
             C217,330 187,290 187,230 
             C187,170 217,130 256,130 Z" 
          fill="#1A102F" stroke="var(--color-secondary, #E20074)" stroke-width="2.5"/>

    <!-- 5. Núcleo de plasma interno inferior -->
    <ellipse cx="256" cy="275" rx="35" ry="20" fill="url(#body-03-core-glow)" opacity="0.75"/>

    <!-- 6. Highlight de volumen superior en el caparazón -->
    <path d="M256,85 
             C295,85 335,120 348,175 
             C330,160 300,150 256,150 
             C212,150 182,160 164,175 
             C177,120 217,85 256,85 Z" 
          fill="var(--color-accent, #F5F340)" opacity="0.3"/>

    <!-- 7. Líneas de segmentación cibernética del blindaje -->
    <path d="M256,70 L256,130" stroke="#8BB9FE" stroke-width="2" stroke-linecap="round"/>
    <path d="M137,230 L187,230" stroke="#8BB9FE" stroke-width="2" stroke-linecap="round"/>
    <path d="M375,230 L325,230" stroke="#8BB9FE" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>