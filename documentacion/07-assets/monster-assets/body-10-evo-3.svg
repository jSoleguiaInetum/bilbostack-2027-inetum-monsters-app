<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-10-evo-3-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="#2B1840"/>
    </linearGradient>
    <linearGradient id="body-10-evo-3-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="50%" stop-color="var(--color-secondary, #E20074)"/>
      <stop offset="100%" stop-color="var(--color-primary, #232D4B)"/>
    </linearGradient>
    <radialGradient id="body-10-evo-3-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7B4"/>
      <stop offset="60%" stop-color="var(--color-accent, #F5F340)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </radialGradient>
  </defs>
  <g id="body-10-evo-3" class="layer-2">
    <ellipse cx="256" cy="460" rx="150" ry="25" fill="var(--color-primary, #232D4B)" opacity="0.4"/>

    <!-- Aros de aceleración gravitatoria cuántica desplegados (+15%) -->
    <ellipse cx="256" cy="256" rx="225" ry="98" fill="none" stroke="var(--color-accent, #F5F340)" stroke-width="3" stroke-dasharray="16 8" opacity="0.85" transform="rotate(-25 256 256)"/>
    <ellipse cx="256" cy="256" rx="200" ry="80" fill="none" stroke="#8BB9FE" stroke-width="2" opacity="0.75" transform="rotate(25 256 256)"/>

    <!-- Anillo toroidal definitivo (+15%) -->
    <path d="M256,60 C390,60 480,150 480,256 C480,362 390,452 256,452 C122,452 32,362 32,256 C32,150 122,60 256,60 Z M256,150 C180,150 120,210 120,256 C120,302 180,362 256,362 C332,362 392,302 392,256 C392,210 332,150 256,150 Z" fill="url(#body-10-evo-3-ring)" stroke="var(--color-primary, #232D4B)" stroke-width="4.5" fill-rule="evenodd" stroke-linejoin="round"/>

    <circle cx="256" cy="256" r="52" fill="url(#body-10-evo-3-core)" opacity="0.98"/>
    <circle cx="256" cy="256" r="26" fill="#FFF7B4"/>

    <!-- Corona imperial superior -->
    <path d="M220,60 L256,15 L292,60 Z" fill="url(#body-10-evo-3-wing)" stroke="var(--color-primary, #232D4B)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="256" cy="15" r="7" fill="var(--color-accent, #F5F340)"/>

    <!-- Armadura ventral con reactor cuántico (y >= 285) -->
    <g id="body-10-evo-3-chest">
      <path d="M185,360 L256,342 L327,360 C312,425 300,440 256,445 C212,440 200,425 185,360 Z" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="256" cy="395" r="15" fill="var(--color-primary, #232D4B)" stroke="var(--color-accent, #F5F340)" stroke-width="2.5"/>
      <circle cx="256" cy="395" r="9" fill="url(#body-10-evo-3-core)"/>
      <circle cx="253" cy="392" r="3.5" fill="#FFF7B4"/>
    </g>
  </g>
</svg>