<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-02-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="70%" stop-color="var(--color-primary, #232D4B)"/>
      <stop offset="100%" stop-color="var(--color-secondary, #E20074)"/>
    </linearGradient>
  </defs>
  <g id="body-02" class="layer-2">
    <!-- Sombra proyectada geométrica -->
    <ellipse cx="256" cy="430" rx="130" ry="20" fill="var(--color-primary, #232D4B)" opacity="0.2"/>

    <!-- Silueta poligonal/angulosa principal -->
    <path d="M190,360 
             L140,280 
             C130,240 145,190 180,165 
             C210,145 240,140 270,145 
             C310,150 350,180 365,220 
             C380,260 375,310 350,355 
             C325,400 280,420 230,415 
             C195,410 195,385 190,360 Z" 
          fill="url(#body-02-grad)"/>

    <!-- Faceta de luz superior -->
    <path d="M210,165 
             C230,152 260,150 290,160 
             C320,170 345,200 350,230 
             C330,210 295,190 260,185 
             C225,180 215,170 210,165 Z" 
          fill="var(--color-accent, #F5F340)" opacity="0.25"/>

    <!-- Faceta de sombra inferior -->
    <path d="M165,330 
             C185,380 230,405 285,395 
             C330,385 350,340 340,300 
             C330,335 290,370 240,370 
             C200,370 175,345 165,330 Z" 
          fill="var(--color-primary, #232D4B)" opacity="0.3"/>

    <!-- Detalle geométrico interno (cristal de datos) -->
    <polygon points="280,270 305,290 290,320 265,300" fill="var(--color-secondary, #E20074)" opacity="0.4"/>
    <polygon points="285,280 297,290 290,305 278,295" fill="var(--color-accent, #F5F340)" opacity="0.6"/>

    <!-- Contorno geométrico -->
    <path d="M190,360 
             L140,280 
             C130,240 145,190 180,165 
             C210,145 240,140 270,145 
             C310,150 350,180 365,220 
             C380,260 375,310 350,355 
             C325,400 280,420 230,415 
             C195,410 195,385 190,360 Z" 
          fill="none" stroke="var(--color-primary, #232D4B)" stroke-width="2.5" opacity="0.4"/>
  </g>
</svg>